# One new run against the completed 960 baseline; only assignment changes.
train:
  model: yolo11s.pt
  data: data/visdrone/dataset.yaml
  project: output/runs
  name: coverage_yolo11s_960_100ep_seed0
  device: "0"
  epochs: 100
  batch: 8
  imgsz: 960
  workers: 0
  seed: 0
  deterministic: true
  optimizer: SGD
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  amp: true
  plots: false
  max_det: 500
  close_mosaic: 10
  patience: 0
sdcl:
  enabled: false
  apply_to: both
  classification_weighting: positive_term
  signal: joint
  scale_reference: 640
  scale_s0: 32
  difficulty_alpha: 0.5
  lambda_max: 0.5
  warmup_epochs: 3
  ramp_epochs: 10
  log_interval: 50
ignore_regions:
  enabled: true
phase:
  enabled: false
coverage:
  enabled: true
  warmup_epochs: 5
  reference_size: 640
  max_side: 32
  minimum_ciou: 0.1
  minimum_relative_alignment: 0.25
  candidates: 13
