# One candidate from the same pretrained initialization and recipe as baseline_960_100.
train:
  model: yolo11s.pt
  data: data/visdrone/dataset.yaml
  project: output/runs
  name: phase_yolo11s_960_100ep_seed0
  device: "0"
  epochs: 100
  batch: 8
  imgsz: 960
  workers: 0
  seed: 0
  deterministic: true
  optimizer: SGD
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  amp: true
  plots: false
  max_det: 500
  close_mosaic: 10
  patience: 0
sdcl:
  enabled: false
ignore_regions:
  enabled: true
phase:
  enabled: true
  weight: 1.0
  warmup_epochs: 5
  ramp_epochs: 10
  interval: 2
  reference_size: 640
  max_side: 32.0
  max_objects_per_image: 256
  border_margin: 32
